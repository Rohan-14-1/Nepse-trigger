<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="popup.css" />
  <title>Order Trigger</title>
</head>
<body>
  <main class="panel">
    <header class="head">
      <div class="brand">
        <span class="brand-mark"></span>
        <span class="brand-name">ORDER&nbsp;TRIGGER</span>
      </div>
      <span id="dot" class="dot" data-state="idle" title="status"></span>
    </header>

    <section class="target">
      <label class="field">
        <span class="label">Symbol</span>
        <input id="symbol" class="input mono" type="text" placeholder="e.g. NABIL" autocomplete="off" spellcheck="false" />
      </label>

      <div class="row">
        <label class="field">
          <span class="label">Quantity</span>
          <input id="quantity" class="input mono" type="number" min="1" step="1" placeholder="10" />
        </label>
        <label class="field">
          <span class="label">Max · optional</span>
          <input id="maxPrice" class="input mono" type="number" min="0" step="0.01" placeholder="auto" />
        </label>
      </div>
    </section>

    <button id="armBtn" class="arm">ARM</button>

    <section class="readout">
      <div class="readout-head">
        <span id="status" class="status mono">idle</span>
        <button id="clearBtn" class="clear" title="clear log">clear</button>
      </div>
      <ul id="logList" class="log mono"></ul>
    </section>

    <p id="banner" class="banner" hidden></p>

    <footer class="foot">Acts only inside the TMS tab you logged into.</footer>
  </main>

  <script src="popup.js"></script>
</body>
</html>
